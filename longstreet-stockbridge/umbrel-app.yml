# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The Listing Coach now answers "why hasn't this sold?" It has its own page
  (Coach, in the sidebar) and puts each listing at the point where buyers
  drop off: not being found, found and then passed over, or watched without
  a sale. Each listing is judged against your own store, with the numbers
  behind the verdict, and the fixes for that problem come first. Listings
  that are simply too new to judge are left alone.


  New checks catch prices below break-even, prices well above what you've
  sold the same item for, a cheaper copy of the same item you also have
  listed, a brand or model missing from the title, and paid shipping or no
  returns. The Coach page also shows your store's usual time to sell, lets
  you send offers to watchers or Sell Similar a whole group in one click,
  and tracks which applied fixes actually led to more views and sales. Click
  Re-analyze on the Coach page after updating.
