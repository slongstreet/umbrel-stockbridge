# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Sales that happen outside eBay finally count. Open any in-stock item and
  hit "Mark sold" to record a Facebook Marketplace or in-person sale with its
  price, where it sold, the date, and who bought it — the sale shows up on
  the Orders page with a green venue badge and flows into your P&L, reports,
  and monthly numbers just like an eBay order, with no fees. Multi-quantity
  items can sell just some units, leaving the rest in stock. Recorded the
  wrong thing? Open the order and hit "Remove sale" — the item goes straight
  back to In Stock.


  Writing off junk got faster too: select several items on the Inventory
  page and the toolbar now has a Write off button that retires the whole
  batch in one step, showing you the total dollar amount headed to your P&L
  as a loss and taking one shared reason for the lot.
