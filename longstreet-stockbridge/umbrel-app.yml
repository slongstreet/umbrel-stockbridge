# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The monthly goals on the Dashboard now tell you how you are doing, not
  just whether you are behind. Each goal shows its percent complete, the
  total you are on pace to finish the month at, and what you need per day
  to still hit it, all on one line. Once a goal is passed the percent keeps
  climbing so you can see how far over you went.


  Each progress bar carries a small tick at how much of the month has gone
  by, so ahead or behind is something you can see at a glance rather than
  read. The header shows how many days are left, and the per-day amounts
  are rounded to whole dollars.
