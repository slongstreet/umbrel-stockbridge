# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Open an order and you now get the whole picture of who bought it: what
  they have spent with you all-time, how many orders they have placed, and
  how far back they go as a customer. It used to just list their other
  purchases.


  Those past purchases are clickable. Picking one opens that order in the
  same panel, so you can walk back through a regular buyer's history
  without losing your place or hunting for the order in the table.


  You can keep a private note on any buyer — "collects DS games", "always
  asks for a combined invoice". Only you ever see it, and it follows the
  buyer into their message conversations. If they have a return in flight,
  the panel says so before you ship, and there is a shortcut to eBay's
  coupon page for that order when you want to thank a regular.


  The same buyer history sits under the conversation header in Messages,
  folded away until you want it.
