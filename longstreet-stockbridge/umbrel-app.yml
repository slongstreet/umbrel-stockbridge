submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Creating a draft now fills in most of the item specifics for you. Brand,
  Platform, Model, Color and eBay's other recommended fields are filled from
  your item's title and from how similar live eBay listings are tagged. Only
  empty fields are filled, and each prefilled field is labeled with where its
  value came from ("from your title", "from similar listings", "from
  barcode", and so on) so you can check it before publishing.


  Price suggestions now search using your item's own title, so details like
  "LL" or a color are no longer dropped, and they run on their own when the
  draft opens. Bundle drafts note that the price comps cover the main item
  alone.


  Items inside a bundle now show as Listed once the bundle is live, instead
  of staying In Draft. Bundles already affected are corrected on the next
  sync.
