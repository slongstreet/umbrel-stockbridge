# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  A buyer's offer could stay hidden. If a listing had been through an offer
  before, a new one on that same listing could arrive without the app
  noticing, so it sat in the eBay Seller Hub while Stockbridge showed
  nothing to answer. One live offer was found this way.


  Every sync and every quarter-hourly check now asks eBay outright which
  listings have an offer waiting, instead of relying on a count that does
  not always move. Anything still missed is picked up within the hour
  rather than half a day. Offers you already know about are unaffected.
