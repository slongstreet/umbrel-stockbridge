# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Sync with eBay now only asks about what changed. Orders, fees, offers,
  and view counts used to be re-pulled in full on every sync; now a
  routine sync fetches just the orders and fee transactions that moved
  since the last one, checks offers only on listings where something is
  new, and refreshes view counts twice a day instead of every time. A
  full pass still runs on its own schedule to catch cancellations, so
  nothing is missed, just not re-read every four hours.


  Fee accuracy: the app now keeps every eBay fee transaction on file and
  works each order's fees out from that record. This fixes a case where a
  refund or shipping label arriving months after a sale could overwrite
  the order's fees with only itself. The first sync after this update
  pulls the year's fee history (a minute or so) and may correct fee
  totals on older orders. That is the fix landing, not a mistake.


  Offers that expired are now closed automatically instead of lingering
  as open in the inbox.
