name: Stockbridge
version: "1.49.1"
tagline: eBay store command center
description: >-
  Self-hosted command center for an eBay store: inventory intake with barcode
  scanning, AI-drafted listings, pricing comps, orders and shipping, P&L
  reports, buyer messaging, and rule-based automations that run around the
  clock.
