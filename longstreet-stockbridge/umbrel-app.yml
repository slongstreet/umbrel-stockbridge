# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  You can now buy shipping labels without leaving the app. Add an EasyPost or
  Shippo account (or both) under Settings, and every order that needs a label
  gets a Ship button: enter the package weight and size — box presets you
  define fill the dimensions for you — and the app fetches rates from every
  provider you enabled, side by side, cheapest first. One click buys the
  label, opens it ready to print at 4×6, and sends the tracking number to
  eBay so the order is marked shipped everywhere at once.


  The label's cost lands on the order automatically and flows into your P&L,
  the same as labels bought on eBay always have. Labels are kept on the box,
  so you can reprint one any time from the order's panel, and if the tracking
  upload to eBay ever fails the order shows a retry button rather than
  losing anything.


  One thing to do after updating: reconnect eBay under Settings. Sending
  tracking numbers needs one more permission than the app had before, and
  eBay only grants it on a fresh connection. Until you do, labels still work
  — the app just can't tell eBay about them, and Settings will show a
  reminder.
