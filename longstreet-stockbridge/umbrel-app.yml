# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  You can now change a listing's price without leaving the app. Open any
  live listing and click the pencil next to its price: take 5% or 10% off
  with one click, or type whatever price you want, including a higher one.
  Before you commit, it shows what the new price nets you after fees,
  shipping, and what the item cost — and warns you if it lands below your
  break-even, without stopping you if that's what you meant to do.


  Moving a price is safer now, too. Any Best Offer auto-accept and
  auto-decline amounts shift along with the asking price. Applying a price
  suggestion from the Listing Coach used to leave those amounts where they
  were, which could quietly leave you auto-accepting offers above your new
  asking price.


  Small fix: when eBay isn't connected, listing actions like publishing,
  ending a listing, or editing photos now say so plainly instead of failing
  with an unexplained error.
