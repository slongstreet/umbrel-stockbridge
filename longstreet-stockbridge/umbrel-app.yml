defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Listings now have a Checkup tab next to Overview, and the Coach page opens
  listings on it. It puts the whole story in one place: the diagnosis, where
  buyers drop off compared with your typical listing, a numbered list of
  what to do, the market, and everything already tried, including earlier
  relists, price changes, and how past suggestions worked out.


  The AI checkup button writes a short summary, compares your listing's
  photo, title, and price with competing copies, and names one next step.
  It only uses the numbers in the checkup; any sentence quoting a figure it
  wasn't given is removed.
