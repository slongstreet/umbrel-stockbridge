# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The four status cards on the Orders page (Needs label, Shipped, No cost
  basis, Returns) now follow the 7d / 31d / 90d selector at the top of the
  page instead of always counting all time. Each card says which window it
  is on, so you can see how many orders you shipped or how many returns you
  took over the period you're looking at. The Profit card keeps its own
  past-24-hours window.


  Clicking a card still narrows the table to exactly the orders it counted,
  now within the same period. The plain "All" view and search are unchanged
  and still cover every order, so older ones stay easy to find.
