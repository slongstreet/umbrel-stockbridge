icon: https://raw.githubusercontent.com/slongstreet/umbrel-stockbridge/main/longstreet-stockbridge/icon.png
port: 8471
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Relist cycles. Listings, Inventory and the listing drawer now show how many
  times an item has been ended and relisted without selling, and its total
  days on the market. Reports has a new Relist cycles view, and the dashboard's
  aging chart counts from when an item was first listed. Automation rules can
  be limited to a range of cycles, so End & sell similar can stop after a set
  number of relists. A listing you recreated on eBay with Sell Similar can be
  linked to the original so its cost and history carry over. Also fixed: a
  sync no longer resets an item's condition to Used - Good.
