# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Restocking a return no longer double-counts what the item cost when eBay
  relisted it for you. When a refunded return goes straight back up through
  eBay's own relist, Stockbridge already puts the unit back on the shelf
  with its original cost. Choosing Restock on that return then added the
  cost a second time, so the item looked twice as expensive as it was.


  Restock now sees that the unit is already back and only settles the
  order: the cost comes off the sale, and the P&L stops showing the return
  as a loss.
