submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Schedule your listings. A draft now has a Schedule button next to Publish
  to eBay: pick a date and time (8:00 PM by default) and Stockbridge
  publishes it for you then. Select several drafts on the Inventory page to
  schedule them together, all at once or spaced a few minutes apart.


  The Inventory page has a new Scheduled card and filter, and each scheduled
  item shows its go-live time. If a scheduled publish fails, or Stockbridge
  wasn't running at the time, the item is flagged so you can publish it or
  pick a new time. Nothing goes up late without asking you. Default time and
  other limits are under Settings, Scheduled publishing.
