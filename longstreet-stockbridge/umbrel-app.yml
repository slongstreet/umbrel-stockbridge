icon: https://raw.githubusercontent.com/slongstreet/umbrel-stockbridge/main/longstreet-stockbridge/icon.png
port: 8471
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Fixes a category that could appear twice in the Reports breakdowns. If you
  ever renamed one of your eBay Store categories, listings created before the
  rename still remembered the old name, so the category showed up as two
  separate rows that each held part of the total.


  The reports now track a category by its identity rather than its name, so
  a rename keeps everything together under the current name.
