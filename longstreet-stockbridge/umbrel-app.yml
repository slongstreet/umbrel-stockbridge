# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The Listing Coach is tuned against real store data. Offers to watchers
  are now suggested only once a listing is past your usual time to sell,
  instead of after a few days. Listings that almost nobody has viewed are
  always flagged, even in quieter categories. Item specifics are only
  suggested when buyers actually search for them, so the long list of
  fields like MPN is gone.


  The Coach page splits urgent listings (Needs attention) from small
  improvements on listings that are doing fine (Quick fixes). Its "What's
  worked" table now leads with sales. It also shows whether listings you
  ended and relisted with Sell Similar sold afterward. Click Re-analyze on
  the Coach page after updating.
