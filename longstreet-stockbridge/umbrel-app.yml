# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Shipping labels now print without the detour. As soon as a label is
  bought, the print dialog opens on its own, and the Print label button in
  the order drawer does the same, so there is no PDF to download, find, and
  print by hand. A small "Download the PDF instead" link stays next to the
  button if you ever want the file.


  Labels are also centered on the 4x6 sticker instead of hugging the top
  edge, so the first row no longer gets clipped. The gap around the label
  is a new Print margin setting under Settings, Shipping labels (a quarter
  inch to start). If your printer still trims an edge, raise it there.
