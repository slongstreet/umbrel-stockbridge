# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Fixes a listing showing up twice. When the background sync and an
  automation pass happened to run at the same moment, an "End & sell
  similar" relist could leave two Active rows for one eBay listing, the
  second one attached to a blank zero-cost item. The two jobs now take
  turns instead of overlapping, the automation pass runs a minute after
  each sync so it works from fresh data, and the sync double-checks before
  creating a new listing row.


  If you press Sync or Run now while the other job is mid-flight, the app
  waits briefly and then tells you it is busy rather than running both at
  once.
