# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Dates now follow your clock instead of the server's. Anything you list or
  sell in the evening lands on today's bar in the dashboard charts rather
  than sliding onto tomorrow's. The app had been reading the clock on the
  machine it runs on, which is set to UTC and rolls over to the next day in
  the early evening.


  The same correction reaches the Today sales card, your monthly goal
  progress, inventory aging, and the monthly report — where a late sale on
  the last day of a month was being counted toward the next one, which also
  skewed that month's projections.


  Fixed: scanning the QR code to add photos from your phone. Since the move
  to Umbrel the phone was being sent to the Umbrel login screen instead of
  the upload page and couldn't get past it. The upload link carries its own
  one-hour pass now, so the phone goes straight to the page.
