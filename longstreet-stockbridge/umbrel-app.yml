# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The Listing Coach now uses eBay impressions: how often each listing was
  shown in search and your store, and how often buyers clicked it. A new
  "Shown, not clicked" stage catches listings buyers see but scroll past,
  where the main photo, title, or price is the fix. Listings that are shown
  and clicked normally are no longer told buyers can't find them.


  Each listing's drawer has a Search funnel card: times shown,
  click-through, and watchers, with daily charts and price changes. The AI
  review now also critiques the main photo buyers see in search. History
  starts filling in from the first sync after updating; click Re-analyze on
  the Coach page once it has run.
