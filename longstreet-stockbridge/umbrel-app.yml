# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  "Check price" in the Listing Coach now shows the market around each
  listing: where your price ranks among comparable copies, how long the
  competing copies have sat unsold, units sold on multi-quantity
  listings, and your own past sales of the item.


  It offers three prices with your profit at each: a quick sale just under
  the cheapest copy (never below break-even), the market median, and your
  current price. "Use this price" updates eBay after you confirm. The
  Coach also suggests undercutting when other copies are cheaper and price
  looks like the reason a listing hasn't sold. A listing no longer counts
  as a comparable copy of itself.
