# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Buying a shipping label through Shippo now works with USPS. The ship-from
  address in Settings has a new Email field, and the Ship dialog will not
  price a package until it is filled in, because USPS refuses to print a
  label without a sender email. Open Settings, add your email to the
  ship-from address, and save before your next label.


  When a label purchase is refused, the message now says which side turned
  it down (USPS or Shippo) and why, instead of a wall of raw text. If Shippo
  reports that invoices are past due, that is a billing hold on your Shippo
  account and clears once you settle it on the Shippo site.
