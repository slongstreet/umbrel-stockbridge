icon: https://raw.githubusercontent.com/slongstreet/umbrel-stockbridge/main/longstreet-stockbridge/icon.png
port: 8471
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  The Orders page has a new card where "Cancelled" used to be: Profit,
  past 24 hours. It shows the total profit on everything you sold in the
  last day, green when you came out ahead and red when you didn't, and
  refreshes on its own as sales come in.


  Click it and the table narrows to just those orders, so you can see
  exactly which sales made up the number. A matching "Past 24h" chip sits
  in the filter row, and the Cancelled chip is still there if you need it.
