# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  When a buyer buys several items at once, the app now treats them as the one
  package they are. On the pick list those items share a single card marked
  "Pack together", listing each one with its own bin, so both come off the
  shelf into the same box instead of sitting at opposite ends of your pull
  walk with nothing connecting them.


  In the orders table, rows from the same checkout are marked and joined
  together, so two "Needs label" rows no longer read as two labels to buy.
  Open either one and a new "In this order" section shows the other items and
  what the whole order came to — the sold total, the one set of fees, the one
  shipping label, and the profit for the order as a whole. The tracking
  number now says it covers every item in the order, rather than looking like
  it got duplicated.


  The app also watches for a different case: the same buyer with two separate
  orders waiting on labels, both going to the same address. Those are now
  flagged on the orders page and the pick list, so you can combine them into
  one shipment in eBay before buying two labels.
