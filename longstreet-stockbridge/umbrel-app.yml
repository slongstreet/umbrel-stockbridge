manifestVersion: 1
id: longstreet-stockbridge
category: finance
name: Stockbridge
version: "2.4.0"
tagline: eBay store command center
description: >-
  Self-hosted command center for an eBay store: inventory intake with barcode
  scanning, AI-drafted listings, pricing comps, orders and shipping, P&L
  reports, buyer messaging, and rule-based automations that run around the
  clock.
developer: Scott Longstreet
website: https://github.com/slongstreet/stockbridge
dependencies: []
# No `repo` field: umbrelOS renders any repo value as a hardcoded
# "Source Code: Public" row, and the app code is private.
support: https://github.com/slongstreet/umbrel-stockbridge/issues
icon: https://raw.githubusercontent.com/slongstreet/umbrel-stockbridge/main/longstreet-stockbridge/icon.png
port: 8471
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Scott Longstreet
submission: https://github.com/slongstreet/umbrel-stockbridge
# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Returns now sync through eBay's newer Returns API. To switch over,
  reconnect eBay once in Settings → eBay and approve the added returns
  permission. Until you do, returns keep syncing the old way. After the
  switch, a return covering several items from one order shows on each
  of those items, and a closed return shows the date eBay closed it.
