# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Time labels now keep themselves current. "Synced 3m ago", message and
  activity timestamps, and offer countdowns used to freeze at whatever they
  said when the page loaded — a tab left open all afternoon still claimed a
  sync from minutes ago. They now tick on their own, and the sync pill also
  picks up background syncs (including failures, which turn it red) without
  a click.


  Best Offer countdowns are now trustworthy where it matters: when an offer
  expires while you have it on screen, the Accept, Counter, and Decline
  buttons disappear the moment the clock runs out instead of offering a
  response eBay would reject. Expired offers also stop counting toward your
  "offers to answer" until they clear on the next sync.


  Small fix: the buyer panel's "Add buyer note" and "Send coupon on eBay"
  links no longer run into each other.
