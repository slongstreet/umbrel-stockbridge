# Rewritten every release: umbrelOS shows this on the update prompt, so it
# describes what changes for someone using the app, not what changed in the
# code. Empty means the prompt says nothing.
releaseNotes: >-
  Automations now follow the Listing Coach. A price drop waits while buyers
  aren't finding a listing, while it's on track, or while Best Offers are
  waiting; End & sell similar waits while it's on track or offers are
  waiting. A gentler step that's due, like an offer to watchers, still
  runs. Each rule has a Follow the Coach switch, rule cards count held
  listings, and held steps link to the listing's Checkup.


  Every suggested offer now shows what it nets after fees, the ad fee,
  shipping, and cost, the same math as the listing's offer calculator. The
  Coach no longer suggests an offer below break-even, and the bulk Send
  offers dialog shows the total net if every offer is accepted.
